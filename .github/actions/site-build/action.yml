# Check both source folders, assemble the single artifact, and — unless this
# deployment is production — neutralise it for search engines.
#
# This lives in a composite action because there are now two hosts. The
# checks below caught a silently-swallowed CSS rule during the desktop build
# and the neutralise step is the only thing keeping a staging copy of a live
# site out of Google's index; a second workflow that reimplemented either
# would drift from this one the first time one of them was edited.
#
# Consumers pass the URL the artifact will be served from. Everything else is
# the same on any host, which is the point: the artifact is the two source
# directories copied verbatim, so either page stays deployable by dragging
# its folder onto any static host.
name: Build the site artifact
description: Verify poc/rawhtml and poc/htmlonly-mobile, assemble _site, and neutralise it unless deploying to production.

inputs:
  base-url:
    description: Public URL the artifact will be served from, e.g. https://example.web.app. Used to rewrite the authored production URLs.
    required: true
  production:
    description: >-
      "true" when this deployment serves the real domain, which leaves the
      authored canonical, sitemap and indexability intact. A CNAME file in the
      desktop folder forces this on as well, which is how GitHub Pages signals
      a custom domain.
    required: false
    default: "false"
  desktop-dir:
    description: Source folder for the 1440 desktop page.
    required: false
    default: poc/rawhtml
  mobile-dir:
    description: Source folder for the 360 mobile page.
    required: false
    default: poc/htmlonly-mobile
  mobile-path:
    description: Where the mobile build sits inside the assembled site.
    required: false
    default: mobile

outputs:
  site-dir:
    description: The assembled directory, ready to upload.
    value: _site

runs:
  using: composite
  steps:
    # Cheap guard against publishing a broken site, run over BOTH folders.
    - name: Check both site directories are intact
      shell: bash
      env:
        DESKTOP_DIR: ${{ inputs.desktop-dir }}
        MOBILE_DIR: ${{ inputs.mobile-dir }}
      run: |
        set -euo pipefail
        rc=0

        # Files every poc/ folder must have. robots.txt and sitemap.xml are
        # NOT in this list: they only make sense at the origin root, so the
        # desktop folder carries them and the mobile folder deliberately
        # does not — see the mobile README.
        common="index.html favicon.svg favicon.png apple-touch-icon.png
                styles/tokens.css styles/base.css styles/sections.css
                styles/motion.css scripts/motion.js
                assets/fonts/allomira-variable.woff2
                assets/fonts/lora-latin.woff2"

        check_dir() {
          local dir="$1" extra="$2"
          echo "── $dir"
          ( cd "$dir"

            for f in $common $extra; do
              [ -f "$f" ] || { echo "::error::$dir is missing $f"; exit 1; }
            done

            # Every relative asset the HTML references must exist. Written
            # to a file first: a `while read` inside a pipeline runs in a
            # subshell, so failures set there would not propagate out.
            grep -oE '(src|href)="[^":#]+"' index.html \
              | sed -E 's/^(src|href)="//; s/"$//' \
              | grep -vE '^(https?:|mailto:|//|/)' \
              | sort -u > /tmp/refs.txt

            inner=0
            while read -r ref; do
              [ -e "$ref" ] || { echo "::error::$dir/index.html references missing $ref"; inner=1; }
            done < /tmp/refs.txt

            # Assets reached from CSS rather than from the markup. The ref
            # check above only reads index.html, so a url() target could go
            # missing without a word — which is not hypothetical: the FAQ
            # chevron is a mask-image and is referenced nowhere else.
            grep -ohE 'url\("[^"]+"\)' styles/*.css \
              | sed -E 's/^url\("//; s/"\)$//' \
              | grep -vE '^(https?:|data:|//)' \
              | sort -u > /tmp/cssrefs.txt

            while read -r ref; do
              [ -n "$ref" ] || continue
              # url() in a stylesheet resolves against the stylesheet, and
              # every sheet here sits in styles/.
              [ -e "styles/$ref" ] || { echo "::error::$dir/styles references missing $ref"; inner=1; }
            done < /tmp/cssrefs.txt

            # Every CSS comment must be closed exactly once. An unbalanced
            # pair does not fail loudly: the prose after a stray `*/` is
            # parsed as a selector and swallows the next rule's whole block.
            # That is how the Serviços transition was silently dead — the
            # page rendered fine and the animation just never ran.
            for f in styles/*.css; do
              o=$(grep -o '/\*' "$f" | wc -l | tr -d ' ')
              c=$(grep -o '\*/' "$f" | wc -l | tr -d ' ')
              [ "$o" = "$c" ] \
                || { echo "::error::$dir/$f has $o '/*' against $c '*/' — a rule is being swallowed"; inner=1; }
            done
            [ "$inner" -eq 0 ] || exit 1

            echo "   $(wc -l < /tmp/refs.txt | tr -d ' ') relative refs OK · $(du -sh . | cut -f1) across $(find . -type f | wc -l | tr -d ' ') files"
          ) || rc=1
        }

        check_dir "$DESKTOP_DIR" "robots.txt sitemap.xml"
        check_dir "$MOBILE_DIR"  ""

        # The mobile folder must NOT ship a robots.txt. It is only honoured
        # at the origin root, so one at /mobile/robots.txt is dead weight
        # that reads as policy.
        [ -f "$MOBILE_DIR/robots.txt" ] \
          && { echo "::error::$MOBILE_DIR/robots.txt would be ignored at a subpath — delete it"; rc=1; }

        [ "$rc" -eq 0 ]

    # One artifact, two sites. Assembled into a scratch directory so the
    # working tree — and therefore the repo — is never mutated.
    - name: Assemble the artifact
      shell: bash
      env:
        DESKTOP_DIR: ${{ inputs.desktop-dir }}
        MOBILE_DIR: ${{ inputs.mobile-dir }}
        MOBILE_PATH: ${{ inputs.mobile-path }}
      run: |
        set -euo pipefail
        rm -rf _site
        mkdir -p "_site/$MOBILE_PATH"
        cp -R "$DESKTOP_DIR/." _site/
        cp -R "$MOBILE_DIR/." "_site/$MOBILE_PATH/"

        [ -f _site/index.html ] || { echo "::error::desktop index.html did not land"; exit 1; }
        [ -f "_site/$MOBILE_PATH/index.html" ] || { echo "::error::mobile index.html did not land"; exit 1; }
        echo "artifact assembled — $(du -sh _site | cut -f1)"

    # A REVIEW APP is not production. joicesperandio.com.br is a live site on
    # other hosting and both pages are authored for it, so a staging copy has
    # to be neutralised or it will interfere with the real domain's search
    # presence.
    #
    # Three things, and the order of reasoning matters:
    #
    # 1. noindex, and crawling left OPEN. A disallow-all robots.txt would be
    #    counterproductive: Google cannot read a noindex it is not allowed
    #    to fetch, and a blocked URL can still be indexed URL-only from
    #    links. To keep a page out, let it be crawled and serve noindex.
    #
    # 2. Rewrite the production URLs to this deployment. Both pages carry an
    #    authored canonical pointing at joicesperandio.com.br. Serving that
    #    here would put a cross-domain canonical on a noindex page — a
    #    combination Google warns against, because the noindex can end up
    #    attributed to the canonical target, i.e. the real site.
    #
    #    The mobile page needs one more rewrite than the desktop. Its
    #    authored canonical points at the DESKTOP url (that is the standard
    #    separate-URL mobile annotation, paired with the desktop's
    #    rel="alternate" back to it), and the blanket rewrite would leave it
    #    pointing at the deployment ROOT — cross-page, not self-referential.
    #    So it is re-pointed at <base>/mobile/ afterwards.
    #
    # 3. Drop sitemap.xml. It lists the production URL, and a review app has
    #    no business advertising a sitemap at all.
    #
    # Only the assembled artifact is mutated. The repo stays
    # production-correct, so there is nothing to undo at cutover.
    - name: Neutralise the review app for search engines
      shell: bash
      env:
        BASE_URL: ${{ inputs.base-url }}
        PRODUCTION: ${{ inputs.production }}
        MOBILE_PATH: ${{ inputs.mobile-path }}
      run: |
        set -euo pipefail

        # Two ways to say "this is production". The CNAME file is how GitHub
        # Pages carries a custom domain, and it travels in the desktop folder;
        # the input is for hosts that keep the domain in their own console,
        # where the repo has no such file to look at.
        if [ -f _site/CNAME ] || [ "$PRODUCTION" = "true" ]; then
          echo "deploying as production — files left as authored"
          exit 0
        fi

        base="${BASE_URL%/}"
        [ -n "$base" ] || { echo "::error::no base-url was given"; exit 1; }

        neutralise() {
          local file="$1" self="$2"
          grep -q '</head>' "$file" || { echo "::error::$file has no </head> to patch"; exit 1; }
          sed -i 's|</head>|  <meta name="robots" content="noindex, nofollow" />\n  </head>|' "$file"

          # Prod → this deployment. The mailto: address must survive, so
          # match only the https:// origin rather than the bare domain.
          sed -i "s|https://joicesperandio\.com\.br|${base}|g" "$file"

          # Make the canonical self-referential — see (2) above. og:url
          # follows it, or the mobile page ends up canonicalising to
          # /mobile/ while telling every share sheet it is the root.
          sed -i "s|rel=\"canonical\" href=\"[^\"]*\"|rel=\"canonical\" href=\"${self}\"|" "$file"
          sed -i "s|property=\"og:url\" content=\"[^\"]*\"|property=\"og:url\" content=\"${self}\"|" "$file"

          # Assert the outcome rather than trusting the seds.
          grep -q 'name="robots" content="noindex' "$file" \
            || { echo "::error::$file: noindex meta missing"; exit 1; }
          if grep -q 'https://joicesperandio\.com\.br' "$file"; then
            echo "::error::$file: a production URL survived the rewrite:"
            grep -n 'https://joicesperandio\.com\.br' "$file"
            exit 1
          fi
          grep -q "rel=\"canonical\" href=\"${self}\"" "$file" \
            || { echo "::error::$file: canonical is not ${self}"; exit 1; }
          grep -q 'oi@joicesperandio.com.br' "$file" \
            || { echo "::error::$file: the mailto address was clobbered"; exit 1; }

          echo "neutralised $file — noindex, crawlable, canonical → ${self}"
        }

        neutralise _site/index.html                  "${base}/"
        neutralise "_site/$MOBILE_PATH/index.html"   "${base}/${MOBILE_PATH}/"

        # Crawlable on purpose — see (1) above. Root only: robots.txt is
        # ignored at a subpath.
        printf 'User-agent: *\nAllow: /\n' > _site/robots.txt
        rm -f _site/sitemap.xml

        # The desktop's rel="alternate" has to reach the mobile page as
        # deployed, or the pair is only half-wired on the review app.
        grep -q "rel=\"alternate\"[^>]*href=\"${base}/${MOBILE_PATH}/\"" _site/index.html \
          || { echo "::error::the desktop alternate does not point at ${base}/${MOBILE_PATH}/"; exit 1; }
