# Publish BOTH landing pages to GitHub Pages on every push to main.
#
# Neither site is at the repo root — `poc/` holds one folder per build
# approach, and two of them ship:
#
#   poc/rawhtml/          → /            the 1440 desktop page
#   poc/htmlonly-mobile/  → /mobile/     the 360 mobile page
#
# They are siblings, not a page and its breakpoint: the mobile frame is a
# separately-designed layout with its own structure and its own copy. See
# .ai/plans/mobile-page.md.
#
# GitHub Pages allows one site per repository, so this is one artifact with
# the mobile build nested inside it rather than two deployments.
#
# The checks, the assembly and the search-engine neutralisation all live in
# .github/actions/site-build, because Firebase Hosting deploys the same
# artifact from .github/workflows/firebase.yml. Two copies of that bash would
# drift the first time either was edited.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy the current main without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Deliberately does NOT cancel a run already in
# progress — cancelling mid-deploy can leave the live site half-updated.
# Queued runs supersede each other instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages
        with:
          # NOTE: this does NOT reliably enable Pages by itself. The first run
          # failed here with "Resource not accessible by integration" — the
          # workflow's GITHUB_TOKEN can deploy to Pages but cannot create the
          # site. It was enabled once, out of band, with:
          #
          #   gh api -X POST repos/guiooak/joicepage/pages -f build_type=workflow
          #
          # Kept at true so a repo that starts from this workflow gets it for
          # free where permissions allow; treat the manual command as the
          # fallback, not the exception.
          enablement: true

      # Checks both folders, assembles _site, and neutralises it for search
      # engines unless a CNAME file says this is production.
      - uses: ./.github/actions/site-build
        with:
          base-url: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test both deployed pages
        run: |
          set -euo pipefail
          root="${{ steps.deployment.outputs.page_url }}"
          echo "deployed to $root"

          fetch() {
            local url="$1" out="$2" code=000
            for i in $(seq 1 10); do
              code=$(curl -sS -o "$out" -w '%{http_code}' -L "$url" || echo 000)
              [ "$code" = "200" ] && return 0
              echo "attempt $i on $url: HTTP $code — retrying"
              sleep 6
            done
            echo "::error::$url returned $code"
            return 1
          }

          # The whole point of both builds is that the copy ships in the HTML
          # rather than waiting on JS, so assert that instead of assuming it.
          # The phrases are chosen to be page-SPECIFIC — a mobile URL that
          # accidentally served the desktop page would still pass a generic
          # "Joice Sperandio" check.
          fetch "$root" /tmp/desktop.html
          for phrase in "Joice Sperandio" \
                        "Planejamento Financeiro" \
                        "Antes da conversa" \
                        "Patrimônio não é apenas aquilo"; do
            grep -qF "$phrase" /tmp/desktop.html \
              || { echo "::error::desktop: \"$phrase\" missing from the served HTML"; exit 1; }
          done

          fetch "${root%/}/mobile/" /tmp/mobile.html
          for phrase in "Joice Sperandio" \
                        "Planejamento Financeiro" \
                        "Patrimônio vai muito além" \
                        "Não sei nada sobre investimentos" \
                        "Recomendações independentes"; do
            grep -qF "$phrase" /tmp/mobile.html \
              || { echo "::error::mobile: \"$phrase\" missing from the served HTML"; exit 1; }
          done

          echo "smoke test passed on both URLs"
