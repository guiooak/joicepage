# Publish BOTH landing pages to GitHub Pages on every push to main.
#
# Neither site is at the repo root — `raw/` holds one folder per build
# approach, and two of them ship:
#
#   raw/mobile/  → /      the 360 mobile page — the root
#   raw/web/     → /inicio/    the 1440 desktop page
#
# Pages has no server-side redirects, so /mobile/ — where the mobile page
# used to be — is a refresh stub the build action writes, pointing at the
# root.
#
# They are siblings, not a page and its breakpoint: the mobile frame is a
# separately-designed layout with its own structure and its own copy. See
# .ai/plans/mobile-page.md.
#
# GitHub Pages allows one site per repository, so this is one artifact with
# the desktop build nested inside it rather than two deployments.
#
# The checks, the assembly and the search-engine neutralisation all live in
# .github/actions/site-build, because Firebase Hosting deploys the same
# artifact from .github/workflows/firebase.yml. Two copies of that bash would
# drift the first time either was edited.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy the current main without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Deliberately does NOT cancel a run already in
# progress — cancelling mid-deploy can leave the live site half-updated.
# Queued runs supersede each other instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages
        with:
          # NOTE: this does NOT reliably enable Pages by itself. The first run
          # failed here with "Resource not accessible by integration" — the
          # workflow's GITHUB_TOKEN can deploy to Pages but cannot create the
          # site. It was enabled once, out of band, with:
          #
          #   gh api -X POST repos/guiooak/joicepage/pages -f build_type=workflow
          #
          # Kept at true so a repo that starts from this workflow gets it for
          # free where permissions allow; treat the manual command as the
          # fallback, not the exception.
          enablement: true

      # Checks both folders, assembles _site, and neutralises it for search
      # engines unless a CNAME file says this is production.
      - uses: ./.github/actions/site-build
        with:
          base-url: ${{ steps.pages.outputs.base_url }}

      # A second, unrelated app in the same Pages site, at a subpath: Pages
      # serves one site per repository, and this is how aconsultorafinanceira
      # shares it. Pages only — firebase.yml does not run this step, so the
      # production deploy never carries the app. Its own script checks it,
      # copies it in and neutralises it as a review app. It runs after
      # site-build, so it is not minified.
      - name: Add aconsultorafinanceira at /aconsultorafinanceira/
        run: |
          bash aconsultorafinanceira/build.sh \
            _site/aconsultorafinanceira \
            "${{ steps.pages.outputs.base_url }}/aconsultorafinanceira"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test both deployed pages
        run: |
          set -euo pipefail
          root="${{ steps.deployment.outputs.page_url }}"
          echo "deployed to $root"

          fetch() {
            local url="$1" out="$2" code=000
            for i in $(seq 1 10); do
              code=$(curl -sS -o "$out" -w '%{http_code}' -L "$url" || echo 000)
              [ "$code" = "200" ] && return 0
              echo "attempt $i on $url: HTTP $code — retrying"
              sleep 6
            done
            echo "::error::$url returned $code"
            return 1
          }

          # The whole point of both builds is that the copy ships in the HTML
          # rather than waiting on JS, so assert that instead of assuming it.
          # The phrases are chosen to be page-SPECIFIC — a mobile URL that
          # accidentally served the desktop page would still pass a generic
          # "Joice Sperandio" check.
          fetch "$root" /tmp/mobile.html
          for phrase in "Joice Sperandio" \
                        "Planejamento Financeiro" \
                        "Patrimônio vai muito além" \
                        "Não sei nada sobre investimentos" \
                        "Recomendações independentes" \
                        "Política de Privacidade"; do
            grep -qF "$phrase" /tmp/mobile.html \
              || { echo "::error::mobile (root): \"$phrase\" missing from the served HTML"; exit 1; }
          done

          fetch "${root%/}/inicio/" /tmp/desktop.html
          for phrase in "Joice Sperandio" \
                        "Planejamento Financeiro" \
                        "Antes da conversa" \
                        "Patrimônio não é apenas aquilo" \
                        "Política de Privacidade"; do
            grep -qF "$phrase" /tmp/desktop.html \
              || { echo "::error::desktop (/inicio/): \"$phrase\" missing from the served HTML"; exit 1; }
          done

          # The old mobile URL must still lead to the root. Pages cannot
          # redirect, so this is the refresh stub the build action wrote.
          fetch "${root%/}/mobile/" /tmp/stub.html
          grep -q 'http-equiv="refresh" content="0; url=../"' /tmp/stub.html \
            || { echo "::error::/mobile/ is not the refresh stub to the root"; exit 1; }

          # aconsultorafinanceira, both pages. `class="menu"` and `class="nav"`
          # tell the mobile page from the desktop one.
          acf="${root%/}/aconsultorafinanceira"
          fetch "$acf/" /tmp/acf-mobile.html
          fetch "$acf/inicio/" /tmp/acf-desktop.html
          for page in /tmp/acf-mobile.html /tmp/acf-desktop.html; do
            for phrase in "Investimentos com tranquilidade e segurança" \
                          "O que um consultor de investimentos NÃO pode fazer?" \
                          "Kamila e Tiago" \
                          'name="robots" content="noindex'; do
              grep -qF "$phrase" "$page" \
                || { echo "::error::aconsultorafinanceira $page: \"$phrase\" missing"; exit 1; }
            done
          done
          grep -q 'class="menu"' /tmp/acf-mobile.html \
            || { echo "::error::/aconsultorafinanceira/ is not the mobile page"; exit 1; }
          grep -q 'class="nav"' /tmp/acf-desktop.html \
            || { echo "::error::/aconsultorafinanceira/inicio/ is not the desktop page"; exit 1; }

          echo "smoke test passed on all URLs"
