<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!-- device-width, not a pinned number: the 360 canvas is the NARROWEST
         phone, not the target. base.css scales the whole canvas to whatever
         width the device reports, so 390 and 430 get the same layout larger
         rather than a different one. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Joice Sperandio — Planejamento Financeiro e Investimentos</title>
    <meta
      name="description"
      content="Planejamento financeiro e consultoria em investimentos para quem deseja construir patrimônio com intenção, tomar decisões com mais segurança e usar o dinheiro para sustentar a vida que deseja viver."
    />

    <!-- The mobile/desktop pair, wired now so the production cutover is a DNS
         change rather than an SEO project. This page is the mobile half: it
         points its canonical at the desktop URL, which in turn points back
         here with `rel="alternate" media="only screen and (max-width: 640px)"`.
         That is the standard annotation for separate-URL mobile sites; without
         it the two URLs compete for the same queries.

         The deploy workflow rewrites this to a self-referential
         `<base>/mobile/` on review apps — see the README. A cross-domain
         canonical on a `noindex` page can attribute the `noindex` to the
         canonical target, i.e. to the real site. -->
    <link rel="canonical" href="https://joicesperandio.com.br/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Joice Sperandio — Planejamento Financeiro e Investimentos" />
    <meta
      property="og:description"
      content="O futuro que você deseja viver começa pelas decisões que toma hoje."
    />
    <meta property="og:url" content="https://joicesperandio.com.br/" />
    <meta property="og:image" content="https://joicesperandio.com.br/assets/img/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="assets/fonts/allomira-variable.woff2"
      crossorigin
    />
    <link rel="preload" as="image" href="assets/img/hero-joice.jpg" fetchpriority="high" />

    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/sections.css" />
    <link rel="stylesheet" href="styles/motion.css" />

    <!-- Deferred and entirely additive: the page is complete without it. -->
    <script src="scripts/motion.js" defer></script>
  </head>

  <!-- The page frame IS the body: a 360-wide vertical stack, 16 padding, 16
       gap. `main` nests inside it with the same gap and no padding of its
       own, so the rhythm is unbroken while `header`, `main` and `footer` keep
       their landmarks. -->
  <body class="frame">
    <!-- Menu 392:8100 · 328x88 @y16 · white · 1px #f4f7f7 · r24 · padX 24 ·
         padY 16 · drop shadow 0 16px 10px rgba(87,121,170,.08). The desktop
         bar's nav row and CTA are both drawn `hidden` here (392:8102,
         392:8103); what is visible is the Logo and a 24px List icon in a 56
         tap target (392:8108 inside 392:8104).

         So the links need a drawer, and it is a native <details>: the frame
         does not draw the open state, and a disclosure is the one control
         that carries "expanded/collapsed" to assistive tech, keyboard and
         no-JS readers without a line of script. Same contract as
         poc/rawhtml — this page is complete with scripting off. -->
    <header class="site-header">
      <!-- Logo 392:8101, 120x48. Drawn as a vector wordmark; set as the same
           two-line Lora lockup the desktop build uses, so the words stay in
           the HTML rather than becoming an image. -->
      <a class="brand" href="#inicio">
        <span>joice</span>
        <span>sperandio</span>
      </a>

      <details class="menu">
        <summary class="menu__toggle" aria-label="Menu">
          <!-- The drawn icon is Phosphor's `List` at 24px, stroke #343330
               ("stone"), three bars inset 15.63% — traced rather than
               exported, because three straight lines are the whole glyph. -->
          <svg class="menu__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M3.75 6h16.5M3.75 12h16.5M3.75 18h16.5" />
          </svg>
        </summary>

        <nav class="menu__panel" aria-label="Navegação principal">
          <a href="#inicio">Início</a>
          <a href="#visao">Visão</a>
          <a href="#servicos">Serviços</a>
          <a href="#processo">Processo</a>
          <a href="#historias">Histórias</a>
          <a href="#sobre">Sobre</a>
          <a href="#duvidas">Dúvidas</a>
          <a class="btn btn--primary" href="https://wa.me/5547991939397" target="_blank" rel="noopener noreferrer">Agendar uma conversa</a>
        </nav>
      </details>
    </header>

    <main>
      <!-- Sections land here one commit at a time, in the order the frame
           draws them — see .ai/plans/mobile-page.md. -->
    </main>
  </body>
</html>
